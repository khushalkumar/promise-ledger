[project]
name = "promise-ledger"
version = "0.1.0"
description = "Evidence-backed contract promise verification agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.118,<1",
  "jinja2>=3.1,<4",
  "neatlogs[openai]>=1.4.26,<2",
  "openai>=2.54,<3",
  "opentelemetry-api>=1.38,<2",
  "pydantic>=2.11,<3",
  "pypdf>=6.1,<7",
  "python-hcl2>=7.3,<8",
  "typer>=0.16,<1",
  "uvicorn>=0.37,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
ledger = "ledger.cli:app"
ledger-ui = "ledger.web:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
